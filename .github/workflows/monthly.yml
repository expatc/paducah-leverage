name: Rebuild Paducah leverage

on:
  schedule:
    # Redfin refreshes the market tracker in the first half of the month;
    # Zillow publishes on the 16th. The 18th catches both.
    - cron: "0 11 18 * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: read
  actions: write            # lets the keep-alive step below re-enable this workflow
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard
        run: |
          mkdir -p site
          python build_paducah.py
          mv index.html data.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep the schedule alive
        # GitHub switches scheduled workflows off after 60 days without repo
        # activity (it happened 2026-11-18). Re-enabling through the API
        # resets that clock, so a monthly run keeps itself alive.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monthly.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
